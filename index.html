<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArenaForge — турниры по CS2</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,800;1,800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110A16; --panel:#1B1224; --p2:#251A30; --line:#33243F; --text:#F1EAF6; --muted:#A596B3;
  --acc:#FFD60A; --acc-ink:#1B1500; --ok:#46C985; --bad:#FF5468;
  --display:"Exo 2","Arial Black",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#F6F2F9;--panel:#FFFFFF;--p2:#F0EAF5;--line:#DDD2E6;--text:#1B1224;--muted:#645673;--acc:#E0B400;--acc-ink:#1B1500;--ok:#1E8A52;--bad:#C0283C;color-scheme:light}
}
:root[data-theme="light"]{--bg:#F6F2F9;--panel:#FFFFFF;--p2:#F0EAF5;--line:#DDD2E6;--text:#1B1224;--muted:#645673;--acc:#E0B400;--acc-ink:#1B1500;--ok:#1E8A52;--bad:#C0283C;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
header{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.logo{font:italic 800 24px var(--display);letter-spacing:.01em;cursor:pointer;background:none;border:0;color:var(--text);padding:0}.logo b{color:var(--acc)}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;color:var(--muted);font:700 14px var(--body);padding:8px 11px;cursor:pointer;border-radius:8px}
nav button[aria-current="true"]{color:var(--text);background:var(--panel)}
.btn{font:800 14px var(--body);border-radius:9px;padding:10px 18px;cursor:pointer;border:2px solid var(--acc);background:var(--acc);color:var(--acc-ink);text-transform:uppercase;letter-spacing:.02em}
.btn.alt{background:transparent;color:var(--text);border-color:var(--line)}.btn.alt:hover{border-color:var(--acc)}
.btn.sm{padding:6px 11px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.ticker{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.tk{flex:0 0 172px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left;color:inherit;font-family:inherit}
.tk small{color:var(--muted);display:block;margin-bottom:3px}
.tk div{display:flex;justify-content:space-between;font-weight:700}
.hero{border-radius:16px;padding:34px 28px;margin:6px 0 18px;color:#fff;background:linear-gradient(120deg,#2A0F4A 0%,#7A1747 62%,#D13A4F 100%);position:relative;overflow:hidden}
.hero small{font-weight:800;letter-spacing:.1em;opacity:.85}
.hero h1{font:italic 800 clamp(30px,6vw,56px)/1 var(--display);margin:8px 0 12px}
.hero .pz{font:800 clamp(24px,4vw,38px) var(--display);color:var(--acc)}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.cols{display:grid;grid-template-columns:1fr 330px;gap:18px}
h2{font:italic 800 22px var(--display);margin:22px 0 12px}h3{margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.pz2{font:800 22px var(--display);color:var(--acc)}
.muted{color:var(--muted)}.hint{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--line);width:fit-content}
.tag.live{color:var(--bad);border-color:var(--bad)}.tag.reg{color:var(--ok);border-color:var(--ok)}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:15px;align-items:center;flex-wrap:wrap}
.sc{font:800 16px var(--display)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:700 15px var(--body);padding:9px 12px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--acc)}
.br{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:22px;overflow-x:auto;padding-bottom:8px}
.col{display:flex;flex-direction:column;gap:12px;min-height:420px}
.col h4{margin:0;text-align:center;background:var(--p2);padding:10px;border-radius:8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.ms{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:12px}
.m{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.m small{color:var(--muted);font-size:12px}
.tr{display:flex;justify-content:space-between;padding:7px 10px;border-radius:6px;background:var(--p2);border-left:3px solid transparent;margin-top:4px;font-weight:700}
.tr.w{border-left-color:var(--ok)}.tr.l{border-left-color:var(--bad);color:var(--muted)}
.f{display:grid;gap:12px;max-width:520px}
label{font-weight:700;font-size:14px;display:grid;gap:6px}
input,select,textarea{font:500 16px var(--body);background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
textarea{min-height:110px}
.num{width:64px;padding:6px 8px;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:22px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.modal{position:fixed;inset:0;background:rgba(6,2,10,.75);display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:400px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--acc);border-radius:12px;padding:12px 18px;font-weight:700;display:none;z-index:30;max-width:90vw}.toast.on{display:block}
.note{font-size:13px;color:var(--muted);margin-top:28px;padding:14px;border:1px solid var(--line);border-radius:12px}
.lnk{background:none;border:0;color:var(--acc);font:700 14px var(--body);cursor:pointer;padding:0 8px 0 0;text-decoration:underline}
.bar{display:grid;grid-template-columns:96px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.track{height:10px;background:var(--p2);border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:var(--acc)}
[hidden]{display:none!important}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <button class="logo" data-go="home" type="button">Arena<b>Forge</b></button>
  <nav id="nav"></nav>
  <div id="auth"></div>
</header>
<div id="app"></div>
<p class="note" id="noteP">Демо-версия: данные хранятся только в этом браузере, аккаунты и пароли хранятся только в этом браузере. Для настоящих игроков, приглашений между людьми и регистрации команд нужен сервер.</p>
</div>

<div class="modal" id="loginM" role="dialog" aria-modal="true" aria-labelledby="l-t"><div class="box">
  <h2 id="l-t" style="margin-top:0">Вход</h2>
  <div class="tabs" style="margin-top:0"><button type="button" data-act="amode" data-id="login" aria-selected="true">Вход</button><button type="button" data-act="amode" data-id="reg" aria-selected="false">Регистрация</button></div>
  <div class="f" data-form="loginForm">
    <label>Никнейм<input id="lNick" maxlength="20" autocomplete="username"></label>
    <label>Пароль<input id="lPass" type="password" autocomplete="current-password"></label>
    <label id="lPass2w" hidden>Повтори пароль<input id="lPass2" type="password" autocomplete="new-password"></label>
    <span class="hint" id="lHint">Один человек — один аккаунт. Ник должен быть уникальным.</span>
    <div class="row"><button class="btn" id="lGo" type="button" data-act="submit" data-form="loginForm">Войти</button><button class="btn alt" type="button" data-close="loginM">Отмена</button></div>
  </div>
</div></div>
<div class="modal" id="secM" role="dialog" aria-modal="true" aria-labelledby="s-t"><div class="box">
  <h2 id="s-t" style="margin-top:0">Секретный код</h2>
  <div class="f" data-form="secForm"><label>Введи код<input id="sIn" type="password" autocomplete="off" required></label>
  <div class="row"><button class="btn" type="button" data-act="submit" data-form="secForm">Открыть</button><button class="btn alt" type="button" data-close="secM">Отмена</button></div></div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var rub=function(n){return Number(n).toLocaleString("ru-RU")+" ₽"};
var fmt=function(t){return new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};
var fd=function(t){return new Date(t).toLocaleDateString("ru-RU",{day:"2-digit",month:"long"})};
function toast(t){var e=$("toast");e.textContent=t;e.className="toast on";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className="toast"},3200)}

/* Общая база для всех устройств: вставь сюда адрес Firebase Realtime Database, например "https://arenaforge-default-rtdb.europe-west1.firebasedatabase.app" (без / в конце). Пусто = данные только в этом браузере. */
var CLOUD="https://arenaforge-37a01-default-rtdb.europe-west1.firebasedatabase.app";
var KEY="arenaforge_v2",S=null,V={view:"home",tid:null,tab:"bracket",atab:"users",adm:false,me:null};
try{S=JSON.parse(localStorage.getItem(KEY));V.me=localStorage.getItem("af_me")||null;V.adm=sessionStorage.getItem("af_adm")==="1"}catch(e){}
var save=function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(CLOUD&&online)cloudSave()};
var uid=function(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var team=function(id){return S.teams.filter(function(t){return t.id===id})[0]};
var tour=function(id){return S.tours.filter(function(t){return t.id===id})[0]};
var tn=function(id){var t=team(id);return t?t.name:"TBD"};
var tg=function(id){var t=team(id);return t?t.tag:"TBD"};
var user=function(n){return S.users.filter(function(u){return u.nick===n})[0]};
var myUser=function(){return V.me?user(V.me):null};
var myTeam=function(){return S.teams.filter(function(t){return t.members.indexOf(V.me)>-1})[0]};
var rounds=function(t){return Math.log2(t.maxTeams)};
var RN=function(t,r){var n=rounds(t),a=["Четвертьфинал","Полуфинал","Финал"];return a[3-n+r]};

function mkT(o){var t=Object.assign({id:uid("T"),created:Date.now(),status:"registration",teams:[],organizer:"admin",rules:RULES,minPlayers:5},o);S.tours.push(t);return t}
function startT(t){
  var ids=t.teams.slice().sort(function(){return Math.random()-.5}),base=new Date(t.start+"T14:00:00").getTime(),R=rounds(t);
  for(var r=0;r<R;r++){var n=t.maxTeams/Math.pow(2,r+1);for(var s=0;s<n;s++)S.matches.push({id:uid("M"),tId:t.id,round:r,slot:s,a:r===0?ids[s*2]:null,b:r===0?ids[s*2+1]:null,sa:null,sb:null,done:false,time:base+r*864e5+s*108e5})}
  t.status="live"}
function setRes(m,sa,sb){
  var t=tour(m.tId),R=rounds(t);m.sa=sa;m.sb=sb;m.done=true;var w=sa>sb?m.a:m.b;
  if(m.round<R-1){var nx=S.matches.filter(function(x){return x.tId===m.tId&&x.round===m.round+1&&x.slot===Math.floor(m.slot/2)})[0];if(m.slot%2===0)nx.a=w;else nx.b=w}
  else{t.status="finished";t.champion=w}}

var RULES="1. Формат: одиночное выбывание, матчи до двух побед (BO3), финал тоже BO3.\n2. Состав: 5 основных игроков, замена до начала матча.\n3. Карты: выбираются по системе бан-пик.\n4. Опоздание больше 15 минут засчитывается как техническое поражение.\n5. Читы, сговор и оскорбления ведут к дисквалификации. Жалобы подаются в личном кабинете.\n6. Решение организатора по спорным ситуациям окончательное, администратор рассматривает жалобы.";

function seedDemo(){
  S={users:[],teams:[],tours:[],matches:[],invites:[],reports:[]};
  [["Nova Pulse","NVP"],["Iron Wolves","IRW"],["Crimson Fox","CRF"],["Ghost Protocol","GHP"],["Night Owls","NGO"],["Steel Rain","STR"],["Vortex Five","VTX"],["Pixel Storm","PXS"]].forEach(function(x,i){
    var m=[1,2,3,4,5].map(function(k){return x[1].toLowerCase()+"_"+k});
    m.forEach(function(n){S.users.push({nick:n,organizer:false,banned:false})});
    S.teams.push({id:"t"+i,name:x[0],tag:x[1],captain:m[0],members:m})});
}
if(!S&&!CLOUD){seedDemo();save()}
if(!S)S={users:[],teams:[],tours:[],matches:[],invites:[],reports:[]};
var local0=S.users.length+S.tours.length;

function trow(m,id,sc,other){var cls=m.done?(sc>other?"w":"l"):"";return '<div class="tr '+cls+'"><span>'+esc(tn(id))+'</span><span>'+(m.done?sc:"")+'</span></div>'}
function matchBox(m,edit){
  var h='<div class="m"><small>'+fmt(m.time)+'</small>'+trow(m,m.a,m.sa,m.sb)+trow(m,m.b,m.sb,m.sa);
  if(edit&&!m.done&&m.a&&m.b)h+='<div class="row" style="margin-top:6px"><input class="num" type="number" min="0" data-sa="'+m.id+'" aria-label="Счёт 1"><input class="num" type="number" min="0" data-sb="'+m.id+'" aria-label="Счёт 2"><button class="btn sm" data-act="score" data-id="'+m.id+'" type="button">Сохранить</button></div>';
  return h+'</div>'}
var canManage=function(t){return V.adm||(V.me&&t.organizer===V.me)};
var isOrg=function(){var u=myUser();return V.adm||(u&&u.organizer)};
function statusTag(t){return t.status==="live"?'<span class="tag live">Идёт</span>':t.status==="finished"?'<span class="tag">Завершён</span>':'<span class="tag reg">Регистрация</span>'}
var wins=function(){var w={};S.matches.forEach(function(m){if(m.done){var id=m.sa>m.sb?m.a:m.b;w[id]=(w[id]||0)+1}});return w};

function tCard(t){return '<div class="card"><div class="row">'+statusTag(t)+'</div><h3>'+esc(t.name)+'</h3><span class="pz2">'+rub(t.prize)+'</span><span class="muted">Старт '+fd(t.start)+' · команд '+t.teams.length+'/'+t.maxTeams+'</span><div class="row"><button class="btn sm" data-act="open" data-id="'+t.id+'" type="button">Открыть</button>'+(t.status==="registration"?'<button class="btn sm alt" data-act="join" data-id="'+t.id+'" type="button">Участвовать</button>':'')+'</div></div>'}
function listM(arr,empty){return arr.length?'<div class="list">'+arr.map(function(m){var t=tour(m.tId);return '<div class="it"><span><b>'+esc(tn(m.a))+'</b> vs <b>'+esc(tn(m.b))+'</b><br><span class="hint">'+esc(t?t.name:"")+' · '+RN(t,m.round)+' · '+fmt(m.time)+'</span></span>'+(m.done?'<span class="sc">'+m.sa+' : '+m.sb+'</span>':'<span class="tag">Скоро</span>')+'</div>'}).join("")+'</div>':'<div class="empty">'+empty+'</div>'}

function vHome(){
  var act=S.tours.filter(function(t){return t.status!=="finished"}),f=act.filter(function(t){return t.status==="live"})[0]||act[0];
  var tick=S.matches.filter(function(m){return m.a&&m.b}).sort(function(a,b){return a.time-b.time}).slice(0,14).map(function(m){var t=tour(m.tId);return '<button class="tk" data-act="open" data-id="'+m.tId+'" type="button"><small>'+fmt(m.time)+' · '+esc(t?t.name:"")+'</small><div><span>'+esc(tg(m.a))+'</span><span>'+(m.done?m.sa:"-")+'</span></div><div><span>'+esc(tg(m.b))+'</span><span>'+(m.done?m.sb:"-")+'</span></div></button>'}).join("");
  var up=S.matches.filter(function(m){return !m.done&&m.a&&m.b}).sort(function(a,b){return a.time-b.time}).slice(0,5);
  var rs=S.matches.filter(function(m){return m.done}).sort(function(a,b){return b.time-a.time}).slice(0,5);
  var w=wins(),top=Object.keys(w).sort(function(a,b){return w[b]-w[a]}).slice(0,5);
  var played=S.matches.filter(function(m){return m.done}).length,prize=S.tours.reduce(function(a,t){return a+t.prize},0);
  return '<div class="ticker" aria-label="Матчи">'+(tick||'<span class="muted">Матчей пока нет</span>')+'</div>'+
  (f?'<section class="hero"><small>'+(f.status==="live"?"ИДЁТ СЕЙЧАС":"РЕГИСТРАЦИЯ ОТКРЫТА")+'</small><h1>'+esc(f.name)+'</h1><div class="pz">Призовой фонд '+rub(f.prize)+'</div><div>Старт '+fd(f.start)+' · команд '+f.teams.length+'/'+f.maxTeams+'</div><div class="row"><button class="btn" data-act="join" data-id="'+f.id+'" type="button">Участвовать</button><button class="btn alt" style="color:#fff;border-color:#fff8" data-act="open" data-id="'+f.id+'" type="button">Сетка и матчи</button></div></section>':'<div class="empty">Турниров пока нет. Их создаёт организатор в разделе «Организатор» или администратор.</div>')+
  '<div class="cols"><div><h2>Активные и предстоящие турниры</h2><div class="grid">'+(act.map(tCard).join("")||'<div class="empty">Турниров нет</div>')+'</div>'+
  '<h2>Ближайшие матчи</h2>'+listM(up,"Ближайших матчей нет")+'<h2>Последние результаты</h2>'+listM(rs,"Результатов пока нет")+'</div>'+
  '<aside><h2>Статистика платформы</h2><div class="card"><div class="row" style="justify-content:space-between"><span>Турниров</span><b>'+S.tours.length+'</b></div><div class="row" style="justify-content:space-between"><span>Команд</span><b>'+S.teams.length+'</b></div><div class="row" style="justify-content:space-between"><span>Сыграно матчей</span><b>'+played+'</b></div><div class="row" style="justify-content:space-between"><span>Призовые фонды</span><b>'+rub(prize)+'</b></div></div>'+
  '<h2>Лучшие команды</h2><table><thead><tr><th>#</th><th>Команда</th><th>Победы</th></tr></thead><tbody>'+(top.map(function(id,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(tn(id))+'</td><td>'+w[id]+'</td></tr>'}).join("")||'<tr><td colspan="3" class="muted">Данных пока нет</td></tr>')+'</tbody></table></aside></div>'}

function vTours(){return '<h2>Все турниры</h2><div class="grid">'+(S.tours.map(tCard).join("")||'<div class="empty">Турниров нет</div>')+'</div>'}

function vTour(){
  var t=tour(V.tid);if(!t){V.view="home";return vHome()}
  var ms=S.matches.filter(function(m){return m.tId===t.id}),R=rounds(t),body="";
  if(V.tab==="bracket"){
    if(t.status==="registration")body='<div class="empty">Сетка появится после старта турнира. Зарегистрировано команд: '+t.teams.length+' из '+t.maxTeams+'.</div>';
    else{body='<div class="br">';for(var r=0;r<R;r++){body+='<div class="col"><h4>'+RN(t,r)+'</h4><div class="ms">'+ms.filter(function(m){return m.round===r}).sort(function(a,b){return a.slot-b.slot}).map(function(m){return matchBox(m,canManage(t))}).join("")+'</div></div>'}body+='</div>';if(t.champion)body+='<h2>Чемпион: '+esc(tn(t.champion))+'</h2>'}}

function joinT(id){
  var t=tour(id),u=myUser();
  if(!requireAuth())return;
  if(u.banned){toast("Твой аккаунт заблокирован");return}
  if(t.status!=="registration"){toast("Регистрация на турнир закрыта");return}
  var x=myTeam();if(!x||x.captain!==V.me){toast("Создай команду в кабинете: регистрировать её может капитан");return}
  if(t.teams.indexOf(x.id)>-1){toast("Твоя команда уже зарегистрирована");return}
  if(x.members.length<t.minPlayers){toast("В команде должно быть минимум "+t.minPlayers+" игроков, сейчас "+x.members.length);return}
  if(t.teams.length>=t.maxTeams){toast("Все места заняты");return}
  t.teams.push(x.id);toast("Команда «"+x.name+"» зарегистрирована");render()}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-go],[data-act],[data-tab],[data-atab],[data-close]");if(!el)return;var d=el.dataset;
  if(d.close){$(d.close).className="modal";return}
  if(d.go){go(d.go);return}
  if(d.tab){V.tab=d.tab;render();return}
  if(d.atab){V.atab=d.atab;render();return}
  var id=d.id,a=d.act;
  if(a==="open"){V.view="tour";V.tid=id;V.tab="bracket";render();scrollTo(0,0)}
  else if(a==="join")joinT(id);
  else if(a==="login"){setMode("login");$("lNick").value="";$("loginM").className="modal open";setTimeout(function(){$("lNick").focus()},0)}
  else if(a==="amode")setMode(id);
  else if(a==="reg")openReg();
  else if(a==="submit")runForm(d.form);
  else if(a==="player"){V.view="player";V.pid=id;render();scrollTo(0,0)}
  else if(a==="editstat"){V.editNick=id||null;render()}
  else if(a==="delteam"){S.teams=S.teams.filter(function(x){return x.id!==id});S.tours.forEach(function(t){t.teams=t.teams.filter(function(x){return x!==id})});render()}
  else if(a==="logout"){V.me=null;try{localStorage.removeItem("af_me")}catch(e){}go("home")}
  else if(a==="secret"){$("sIn").value="";$("secM").className="modal open";setTimeout(function(){$("sIn").focus()},0)}
  else if(a==="acc"||a==="accfor"){var i=S.invites.filter(function(x){return x.id===id})[0],tm=team(i.teamId);if(tm.members.indexOf(i.nick)<0)tm.members.push(i.nick);if(!user(i.nick))S.users.push({nick:i.nick,organizer:false,banned:false});i.status="accepted";toast(i.nick+" в команде «"+tm.name+"»");render()}
  else if(a==="dec"){S.invites.filter(function(x){return x.id===id})[0].status="declined";render()}
  else if(a==="start"){var t=tour(id);if(t.teams.length<t.maxTeams){toast("Нужно "+t.maxTeams+" команд, сейчас "+t.teams.length);return}startT(t);V.view="tour";V.tid=id;V.tab="bracket";toast("Турнир начался, сетка создана");render()}
  else if(a==="score"){var m=S.matches.filter(function(x){return x.id===id})[0],ea=document.querySelector('[data-sa="'+id+'"]'),eb=document.querySelector('[data-sb="'+id+'"]'),sa=parseInt(ea.value,10),sb=parseInt(eb.value,10);
    if(isNaN(sa)||isNaN(sb)||sa<0||sb<0||sa===sb){toast("Укажи счёт без ничьей");return}setRes(m,sa,sb);toast("Результат сохранён");render()}
  else if(a==="org"){var u=user(id);u.organizer=!u.organizer;render()}
  else if(a==="ban"){var u2=user(id);u2.banned=!u2.banned;render()}
  else if(a==="delt"){S.tours=S.tours.filter(function(x){return x.id!==id});S.matches=S.matches.filter(function(x){return x.tId!==id});render()}
  else if(a==="resolve"){S.reports.filter(function(x){return x.id===id})[0].status="closed";render()}
  else if(a==="reset"){if(confirm("Сбросить все данные?")){try{localStorage.removeItem(KEY)}catch(e){}if(CLOUD){fetch(CLOUD+"/af.json",{method:"DELETE"}).then(function(){location.reload()},function(){location.reload()})}else location.reload()}}
});

  var low=n.toLowerCase(),u=S.users.filter(function(x){return x.nick.toLowerCase()===low})[0];
  if(!reg){
    if(Date.now()<authLock){toast("Слишком много попыток, подожди полминуты");return}
    if(u&&!u.hash){toast("У этого ника ещё нет пароля. Открой «Регистрация» и задай его.");return}
    if(!u||pwHash(u.salt,pw)!==u.hash){authFail++;if(authFail>=5){authFail=0;authLock=Date.now()+30000}toast("Неверный ник или пароль");return}
    if(u.banned){toast("Этот аккаунт заблокирован");return}
    authFail=0;enter(u.nick);return}
  if(!/^[A-Za-z0-9А-Яа-яЁё_-]{3,20}$/.test(n)){toast("Ник: 3–20 символов, буквы, цифры, _ и -");return}
  if(pw.length<6){toast("Пароль: минимум 6 символов");return}
  if(pw!==$("lPass2").value){toast("Пароли не совпадают");return}
  if(u&&(u.hash||/^[a-z]{3}_[1-5]$/.test(u.nick))){toast("Этот ник уже занят");return}
  if(u&&u.banned){toast("Этот аккаунт заблокирован");return}
  var mine=null;try{mine=localStorage.getItem("af_acct")}catch(e){}
  if(mine&&!V.adm&&user(mine)){toast("С этого браузера уже создан аккаунт «"+mine+"». Один человек — один аккаунт");return}
  var salt=Math.random().toString(36).slice(2)+Date.now().toString(36),h=pwHash(salt,pw);
  if(u){u.salt=salt;u.hash=h}else S.users.push({nick:n,organizer:false,banned:false,salt:salt,hash:h});
  try{localStorage.setItem("af_acct",u?u.nick:n)}catch(e){}
  enter(u?u.nick:n)}
function runForm(f){
  if((f==="teamForm"||f==="invForm"||f==="repForm"||(f==="tForm"&&!V.adm))&&!requireAuth())return;
  if(f==="loginForm"){doAuth()}
  else if(f==="teamForm"){var nm=$("tName").value.trim(),tag=$("tTag").value.trim().toUpperCase();
    if(!nm||tag.length<2){toast("Заполни название и тег (минимум 2 символа)");return}
    if(S.teams.some(function(t){return t.name.toLowerCase()===nm.toLowerCase()||t.tag===tag})){toast("Такое название или тег уже заняты");return}
    S.teams.push({id:uid("t"),name:nm,tag:tag,captain:V.me,members:[V.me]});toast("Команда создана");render()}
  else if(f==="invForm"){var nk=$("iNick").value.trim(),t=myTeam();
    if(!nk||t.members.indexOf(nk)>-1){toast("Игрок уже в команде");return}
    if(S.invites.some(function(i){return i.teamId===t.id&&i.nick===nk&&i.status==="pending"})){toast("Приглашение уже отправлено");return}
    S.invites.push({id:uid("i"),teamId:t.id,nick:nk,status:"pending"});toast("Приглашение отправлено");render()}
  else if(f==="repForm"){if(!$("rText").value.trim()){toast("Напиши, что случилось");return}S.reports.unshift({id:uid("r"),from:V.me,at:Date.now(),text:$("rText").value.trim(),status:"open"});toast("Обращение отправлено администратору");render()}
  else if(f==="tForm"){
    if(!$("oName").value.trim()||!$("oDate").value){toast("Укажи название и дату старта");return}
    var t2=mkT({name:$("oName").value.trim(),prize:Math.max(0,parseInt($("oPrize").value,10)||0),start:$("oDate").value,maxTeams:parseInt($("oMax").value,10),minPlayers:Math.max(1,parseInt($("oMin").value,10)||5),rules:$("oRules").value,organizer:V.me||"admin"});
    toast("Турнир создан");V.view="tour";V.tid=t2.id;V.tab="bracket";render()}
  else if(f==="secForm"){secCheck()}
  else if(f==="statForm"){saveStats()}
}
document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter"||ev.target.tagName==="TEXTAREA")return;
  var c=ev.target.closest&&ev.target.closest("[data-form]");
  if(c&&c.classList.contains("f")){ev.preventDefault();runForm(c.dataset.form)}
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="pFilter"){var q=ev.target.value.toLowerCase();document.querySelectorAll(".pcard").forEach(function(c){c.hidden=c.textContent.toLowerCase().indexOf(q)<0})}
});

var HASH="614175f77ba6d5e9d5d3550988fb62c6d7c26cbda7dcc3f9ef46bd1e4a6cf9bc",tries=0,lock=0;
function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}var mp=Math.pow,mw=mp(2,32),i,j,r="",w=[],al=ascii.length*8,h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={};for(var c=2;pc<64;c++)if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;h[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return"";w[i>>2]|=j<<((3-i)%4)*8}w[w.length]=((al/mw)|0);w[w.length]=al;for(j=0;j<w.length;){var wc=w.slice(j,j+=16),old=h;h=h.slice(0,8);for(i=0;i<64;i++){var w15=wc[i-15],w2=wc[i-2],a=h[0],e=h[4],t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^(~e&h[6]))+k[i]+(wc[i]=i<16?wc[i]:(wc[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+wc[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0),t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}for(i=0;i<8;i++)h[i]=(h[i]+old[i])|0}for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;r+=((b<16)?0:"")+b.toString(16)}return r}
function secCheck(){
  if(Date.now()<lock){toast("Слишком много попыток, подожди полминуты");return}
  var ok=sha256($("sIn").value.trim())===HASH;$("sIn").value="";
  if(!ok){tries++;if(tries>=5){tries=0;lock=Date.now()+30000}toast("Неверный код");return}
  tries=0;V.adm=true;try{sessionStorage.setItem("af_adm","1")}catch(e){}
  $("secM").className="modal";toast("Админ-панель открыта");V.view="admin";render()}
/* ---------- общая база (Firebase Realtime Database через REST) ---------- */
var COLS=["users","teams","tours","matches","invites","reports"],online=false,pending=false,saveT=null,lastKey="";
var emptySnap=function(){var m={};COLS.forEach(function(c){m[c]={}});return m},snapRem=emptySnap();
var kOf=function(c,o){return c==="users"?encodeURIComponent(o.nick).replace(/\./g,"%2E"):o.id};
function snapOf(){var m=emptySnap();COLS.forEach(function(c){S[c].forEach(function(o){m[c][kOf(c,o)]=JSON.stringify(o)})});return m}
function cloudSave(){pending=true;clearTimeout(saveT);saveT=setTimeout(flush,300)}
function flush(){
  var cur=snapOf(),prev=snapRem,jobs=[];
  COLS.forEach(function(c){var patch={},any=false;
    Object.keys(cur[c]).forEach(function(k){if(cur[c][k]!==prev[c][k]){patch[k]=JSON.parse(cur[c][k]);any=true}});
    Object.keys(prev[c]).forEach(function(k){if(!(k in cur[c])){patch[k]=null;any=true}});
    if(any)jobs.push(fetch(CLOUD+"/af/"+c+".json",{method:"PATCH",body:JSON.stringify(patch)}).then(function(r){if(!r.ok)throw 0}))});
  snapRem=cur;
  Promise.all(jobs).then(function(){pending=false}).catch(function(){snapRem=prev;pending=false;toast("Не удалось сохранить в общую базу")})}
function applyRemote(d){
  d=d||{};COLS.forEach(function(c){S[c]=Object.keys(d[c]||{}).map(function(k){return d[c][k]})});
  S.tours.forEach(function(t){t.teams=t.teams||[]});S.teams.forEach(function(t){t.members=t.members||[]});
  S.tours.sort(function(a,b){return(a.created||0)-(b.created||0)});S.reports.sort(function(a,b){return(b.at||0)-(a.at||0)});
  snapRem=snapOf()}
function busy(){var a=document.activeElement;return(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||document.querySelector(".modal.open")}
function poll(first){
  if(pending)return;
  fetch(CLOUD+"/af.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    if(first&&!d){online=true;V.loading=false;
      if(local0){snapRem=emptySnap()}else{seedDemo();snapRem=emptySnap()}
      flush();render();return}
    var key=JSON.stringify(d||{});
    if(first||key!==lastKey){if(!first&&busy())return;lastKey=key;applyRemote(d);online=true;V.loading=false;render()}
  }).catch(function(){if(first&&V.loading){V.loading=false;toast("Нет связи с общей базой, показаны локальные данные");render()}})}
function cloudStart(){
  var n=$("noteP");if(n)n.textContent="Данные общие для всех устройств. Не используй здесь пароль, который есть у тебя на других сайтах.";
  V.loading=true;render();poll(true);setInterval(function(){poll(!online)},4000)}
render();
if(CLOUD)cloudStart();
})();
